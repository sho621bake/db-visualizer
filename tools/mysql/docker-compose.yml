services:
  mysql:
    image: mysql:8.4
    container_name: db-visualizer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: innodb_viz
    ports:
      # ローカルの 3306 と衝突しないようにずらす
      - "13306:3306"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      # 初回起動は seed 投入があり遅いので retries を多めに取る
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
